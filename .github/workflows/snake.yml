
name: Generate Cyber Blue Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Cyber Blue Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Bboysis
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00E5FF&color_dots=#0D1117,#0B2545,#0B4F8A,#087CA7,#00D4FF

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
